<body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-md w-96">
            <h1 class="text-2xl font-bold text-center mb-6 text-gray-900">Sign in to continue</h1>

            <!-- GitHub Login Button -->
            <button onclick="handleLogin()" class="w-full flex items-center justify-center px-4 py-2 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">

<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Your existing head content -->
</head>
<body class="bg-gray-50">
    <!-- Your existing HTML content -->

    <script>
        function handleLogin() {
            window.location.href = 'http://localhost:5000/auth/github';
        }

        // Modified callback handling
        window.onload = async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (token) {
                try {
                    // Validate token with backend
                    const response = await fetch('http://localhost:5000/api/validate-token', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        // Store the token
                        localStorage.setItem('authToken', token);

                        // Show success message
                        document.getElementById('status').innerHTML =
                            '<div class="text-green-600">Successfully authenticated! Redirecting...</div>';

                        // Clean up URL
                        window.history.replaceState({}, document.title, window.location.pathname);

                        // Redirect to dashboard
                        setTimeout(() => {
                            window.location.href = '/index.html';
                        }, 1500);
                    } else {
                        throw new Error('Invalid token');
                    }
                } catch (error) {
                    document.getElementById('status').innerHTML =
                        '<div class="text-red-600">Authentication failed. Please try again.</div>';
                }
            }
        }
    </script>
</body>
</html>
</body>
