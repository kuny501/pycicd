<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CI/CD Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div id="app" class="container mx-auto px-4 py-8">
        <div class="bg-white shadow-lg rounded-lg p-6">
            <h1 class="text-2xl font-bold mb-6">CI/CD Dashboard</h1>

            <!-- Formulaire de création -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4">Créer un nouveau pipeline</h2>
            <form id="pipelineForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nom du pipeline</label>
                    <input type="text" id="pipelineName" required
                           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">URL du dépôt GitHub</label>
                     <input type="url" id="pipelineRepoUrl" placeholder="https://github.com/user/repo"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                </div>
                <button onclick="triggerDeploy()" class="mt-6 bg-green-500 text-white px-4 py-2 rounded">
                    Deploy
                </button>
            </form>
        </div>

            <!-- Liste des pipelines -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Pipelines existants</h2>
            <div id="pipelinesList" class="space-y-4"></div>
        </div>
                <h1>Logs du Backend</h1>
    <div id="log-container"></div>

    </div>
    </div>
    </div>

     <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>


        // Frontend JavaScript
        let token = localStorage.getItem('token');
        let userRole = localStorage.getItem('user_role');

        // Check for token in URL (after OAuth callback)
        window.onload = function() {
            if (!token) {
                window.location.replace('/')
            }
            else {
                verifyAuth();
            }
        };

        async function verifyAuth() {
            try {
                const response = await fetch('/auth/verify', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    localStorage.removeItem('token');
                    token = null;
                    window.location.replace('/');
                }
            } catch (error) {
                console.error('Auth verification failed:', error);
                window.location.replace('/');
            }
        }

        async function triggerDeploy() {
            try {
                const response = await fetch('/deploy', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        repo_url: 'https://github.com/AMELEF/LibrarIMT.git',
                        branch: 'main'
                    })
                });

                const data = await response.json();
                updatePipelineStatus(data);
            } catch (error) {
                console.error('Deployment failed:', error);
            }
        }

        function updatePipelineStatus(status) {
            // Update UI based on pipeline status
            document.getElementById('stage-checkout').textContent = status.checkout || 'Waiting...';
            // Update other stages...
        }
         const socket = io('http://localhost:5000');
        const logContainer = document.getElementById('log-container');

        socket.on('log_message', function(data) {
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            logEntry.textContent = data.message;
            logContainer.appendChild(logEntry);

            // Auto-scroll vers le bas
            logContainer.scrollTop = logContainer.scrollHeight;
        });

        // Gestion des erreurs de connexion
        socket.on('connect_error', (error) => {
            console.error('Erreur de connexion WebSocket:', error);
            const errorDiv = document.createElement('div');
            errorDiv.style.color = 'red';
            errorDiv.textContent = 'Erreur de connexion au serveur';
            logContainer.appendChild(errorDiv);
        });
    </script>
</body>
</html>
