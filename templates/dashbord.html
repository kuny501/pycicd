<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-8">CI/CD Pipeline Manager</h1>

        &lt;!&ndash; Formulaire de création &ndash;&gt;
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4">Créer un nouveau pipeline</h2>
            <form id="pipelineForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nom du pipeline</label>
                    <input type="text" id="pipelineName" required
                           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Statut initial</label>
                    <select id="pipelineStatus" required
                            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                        <option value="running">En cours</option>
                        <option value="success">Succès</option>
                        <option value="failed">Échec</option>
                        <option value="cancelled">Annulé</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">URL du dépôt GitHub</label>
                     <input type="url" id="pipelineRepoUrl" placeholder="https://github.com/user/repo"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                </div>
                <button type="submit"
                        class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    Créer le pipeline
                </button>
            </form>
        </div>

        &lt;!&ndash; Liste des pipelines &ndash;&gt;
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Pipelines existants</h2>
            <div id="pipelinesList" class="space-y-4"></div>
        </div>
    </div>

        <div id="pipelineSteps" class="space-y-4 bg-gray-50 p-4 rounded-lg shadow-md mt-8">
            <h2 class="text-xl font-semibold mb-4">Étapes du pipeline</h2>
        </div>

    <script>
        const API_URL = 'http://localhost:8000';

        // Fonction pour charger les pipelines
        async function loadPipelines() {
            try {
                const response = await axios.get(`${API_URL}/pipelines/`);
                const pipelinesList = document.getElementById('pipelinesList');
                pipelinesList.innerHTML = '';

                response.data.forEach(pipeline => {
                    const statusColor = {
                        'running': 'bg-yellow-100 text-yellow-800',
                        'success': 'bg-green-100 text-green-800',
                        'failed': 'bg-red-100 text-red-800',
                        'cancelled': 'bg-blue-100 text-blue-800'
                    }[pipeline.status];

                    const pipelineElement = document.createElement('div');
                    pipelineElement.className = 'border rounded-lg p-4 flex justify-between items-center';
                    pipelineElement.innerHTML = `
    <div>
        <h3 class="font-semibold">${pipeline.name}</h3>
        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${statusColor}">
            ${pipeline.status}
        </span>
        <p class="text-sm text-gray-500">
            Créé le: ${new Date(pipeline.created_at).toLocaleString()}
        </p>
    </div>
    <div class="space-x-2">
        <button onclick="deletePipeline(${pipeline.id})" class="text-red-600 hover:text-red-900">
            Supprimer
        </button>
        <button onclick="redirectToPage2()">
            Déploiement
        </button>
    </div>
`;
                    pipelinesList.appendChild(pipelineElement);
                });
            } catch (error) {
                console.error('Erreur lors du chargement des pipelines:', error);
                alert('Erreur lors du chargement des pipelines');
            }
        }

        // Gestionnaire de soumission du formulaire
        document.getElementById('pipelineForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const pipelineData = {
                name: document.getElementById('pipelineName').value,
                status: document.getElementById('pipelineStatus').value
            };

            try {
                await axios.post(`${API_URL}/pipelines/`, pipelineData);
                document.getElementById('pipelineForm').reset();
                loadPipelines();
            } catch (error) {
                console.error('Erreur lors de la création du pipeline:', error);
                alert('Erreur lors de la création du pipeline');
            }
        });


        // Fonction pour supprimer un pipeline
        async function deletePipeline(pipelineId) {
            if (!confirm('Êtes-vous sûr de vouloir supprimer ce pipeline ?')) return;

            try {
                await axios.delete(`${API_URL}/pipelines/${pipelineId}`);
                loadPipelines();
            } catch (error) {
                console.error('Erreur lors de la suppression du pipeline:', error);
                alert('Erreur lors de la suppression du pipeline');
            }
        }

        // Charger les pipelines au chargement de la page
        loadPipelines();
        function redirectToPage2() {
         // Rediriger vers la deuxième page
            window.location.href = "suivi.html";
         }

    </script>
</body>
